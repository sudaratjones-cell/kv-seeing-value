<!DOCTYPE html>
<html>
<head>
  <title>KV Seeing Value</title>
</head>
<body>

<h2>ตอนนี้ชีวิตเราเป็นยังไงบ้างนะ</h2>

<button onclick="saveData('ดี')">ไปได้ดี</button>
<button onclick="saveData('เฉย')">เฉย ๆ</button>
<button onclick="saveData('แย่')">เริ่มแย่</button>

<script>
const SUPABASE_URL = "PASTE_URL_HERE";
const SUPABASE_KEY = "PASTE_KEY_HERE";

async function saveData(q1) {
  await fetch(SUPABASE_URL + "/rest/v1/answers", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    },
    body: JSON.stringify({
      q1: q1
    })
  });

  alert("บันทึกแล้ว");
}
</script>

</body>
</html>
